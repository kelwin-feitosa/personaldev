services:
  postgres:
    image: postgres:17
    container_name: personaldev-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - personaldev-postgres-data:/var/lib/postgresql/data

volumes:
  personaldev-postgres-data: